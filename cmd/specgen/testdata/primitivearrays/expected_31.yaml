openapi: 3.1.0
info:
    title: PrimitiveArrays Fixture
    version: 1.0.0
paths:
    /primitives:
        get:
            responses:
                "200":
                    description: Primitive matrix
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Primitives'
components:
    schemas:
        Primitives:
            type: object
            properties:
                int64s:
                    type: array
                    items:
                        type: integer
                float32s:
                    type: array
                    items:
                        type: number
                bools:
                    type: array
                    items:
                        type: boolean
                times:
                    type: array
                    items:
                        type: string
                blob:
                    type: array
                    items:
                        type: string
                    format: byte
                int_map:
                    type: object
                    additionalProperties:
                        type: integer
                bool_map:
                    type: object
                    additionalProperties:
                        type: boolean
                time_map:
                    type: object
                    additionalProperties:
                        type: string
                u32:
                    type: integer
                i32:
                    type: integer
                    format: int32
                f64:
                    type: number
                    format: double
            required:
                - int64s
                - float32s
                - bools
                - times
                - blob
                - int_map
                - bool_map
                - time_map
                - u32
                - i32
                - f64
            description: Primitive type matrix
