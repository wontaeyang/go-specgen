openapi: 3.1.0
info:
    title: ArrayConstraints Fixture
    version: 1.0.0
paths:
    /tags:
        get:
            responses:
                "200":
                    description: Tag list
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TagList'
components:
    schemas:
        TagList:
            type: object
            properties:
                tags:
                    type: array
                    items:
                        type: string
                    maxItems: 10
                    minItems: 1
                    uniqueItems: true
                    description: Unique tags
                scores:
                    type: array
                    items:
                        type: integer
                    minItems: 2
                    description: Scores
            required:
                - tags
            description: A list of tags
