openapi: 3.1.0
info:
    title: InlineSchemaRef Fixture
    version: 1.0.0
paths:
    /box:
        get:
            responses:
                "200":
                    description: Response for status 200
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    widget:
                                        $ref: '#/components/schemas/Widget'
                                        description: The boxed widget
                                required:
                                    - widget
components:
    schemas:
        Widget:
            type: object
            properties:
                name:
                    type: string
                    description: Widget name
            required:
                - name
            description: A widget
