openapi: 3.1.0
info:
    title: MixedResponses Fixture
    version: 1.0.0
paths:
    /things:
        get:
            responses:
                "200":
                    description: OK from block
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Thing'
                "500":
                    description: Server error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Err'
                "404":
                    description: Response for status 404
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        description: Not-found code
                                required:
                                    - code
components:
    schemas:
        Err:
            type: object
            properties:
                code:
                    type: string
                    description: Error code
            required:
                - code
            description: An error
        Thing:
            type: object
            properties:
                name:
                    type: string
                    description: Thing name
            required:
                - name
            description: A thing
