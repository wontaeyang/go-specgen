openapi: 3.1.0
info:
    title: Struct Parameter Field Fixture
    description: Parameter fields whose Go type is a struct.
    version: 1.0.0
paths:
    /areas:
        get:
            summary: Search an area
            parameters:
                - name: origin
                  in: query
                  description: Search origin
                  required: false
                  schema:
                    type: string
                - name: window
                  in: query
                  description: Time window
                  required: false
                  schema:
                    type: string
                - name: radius
                  in: query
                  description: Search radius in meters
                  required: false
                  schema:
                    type: integer
                    minimum: 0
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Coords'
components:
    schemas:
        Coords:
            type: object
            properties:
                lat:
                    type: number
                    format: double
                    description: Latitude
                lon:
                    type: number
                    format: double
                    description: Longitude
            required:
                - lat
                - lon
