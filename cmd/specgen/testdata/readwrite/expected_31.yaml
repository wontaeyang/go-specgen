openapi: 3.1.0
info:
    title: ReadWrite Fixture
    version: 1.0.0
paths:
    /me:
        get:
            responses:
                "200":
                    description: Current user
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
components:
    schemas:
        User:
            type: object
            properties:
                id:
                    type: string
                    description: User ID
                    readOnly: true
                password:
                    type: string
                    description: Password
                    writeOnly: true
                name:
                    type: string
                    description: Display name
            required:
                - id
                - password
                - name
            description: User account
