openapi: 3.1.0
info:
    title: ExclusiveBounds Fixture
    version: 1.0.0
paths:
    /metric:
        get:
            responses:
                "200":
                    description: Metric values
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Metric'
components:
    schemas:
        Metric:
            type: object
            properties:
                ratio:
                    exclusiveMaximum: 1
                    exclusiveMinimum: 0
                    type: number
                    format: double
                    description: Ratio strictly between 0 and 1
                count:
                    type: integer
                    maximum: 100
                    minimum: 0
                    description: Inclusive count
            required:
                - ratio
                - count
            description: A measured metric
