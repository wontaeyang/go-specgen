openapi: 3.1.0
info:
    title: Field Overrides Example
    description: |-
        Demonstrates @required and @nullable as explicit overrides on @field.
        These let you decouple OpenAPI required/nullable from Go pointer-ness and json tags.
    version: 1.0.0
paths:
    /login:
        post:
            summary: Log in
            operationId: login
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
                required: true
            responses:
                "200":
                    description: Login succeeded
    /profiles/{id}:
        get:
            summary: Get a profile
            operationId: getProfile
            parameters:
                - name: id
                  in: path
                  description: Profile ID
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NullableProfile'
    /promos:
        post:
            summary: Create a promo code
            operationId: createPromo
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreatePromo'
                required: true
            responses:
                "201":
                    description: Promo created
    /users/{id}:
        patch:
            summary: Patch user fields
            operationId: patchUser
            parameters:
                - name: id
                  in: path
                  description: User ID
                  required: true
                  schema:
                    type: string
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateUserPatch'
                required: true
            responses:
                "200":
                    description: User updated
components:
    schemas:
        CreatePromo:
            type: object
            properties:
                code:
                    type: string
                    description: Promo code
                percent:
                    type:
                        - integer
                        - "null"
                    maximum: 100
                    minimum: 0
                    description: Discount percent; 0 is a valid value
            required:
                - code
                - percent
        LoginRequest:
            type: object
            properties:
                email:
                    type: string
                    format: email
                    description: User email
                password:
                    type: string
                    description: User password
                tfa_code:
                    type: string
                    description: Two-factor auth code, optional
            required:
                - email
                - password
        NullableProfile:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                    description: User ID
                date_of_birth:
                    type:
                        - string
                        - "null"
                    format: date
                    description: Date of birth; null if not provided
                bio:
                    type:
                        - string
                        - "null"
                    description: Biography text; null if cleared
            required:
                - id
                - date_of_birth
                - bio
        TagDefaults:
            type: object
            properties:
                plain:
                    type: string
                    description: 'string: required, not nullable'
                plain_omit:
                    type: string
                    description: 'string,omitempty: optional, not nullable'
                ptr:
                    type:
                        - string
                        - "null"
                    description: '*string: required, nullable — nil encodes as null'
                ptr_omit:
                    type: string
                    description: '*string,omitempty: optional, not nullable — nil is omitted, never null'
                ptr_zero:
                    type: string
                    description: '*string,omitzero: same as omitempty — optional, not nullable'
                tags:
                    type: array
                    items:
                        type: string
                    description: '[]string: required, not nullable by default; add @nullable true if the handler can return a nil slice'
                opt_tags:
                    type: array
                    items:
                        type: string
                    description: '[]string,omitempty: optional; nil and empty are both omitted'
                labels:
                    type: object
                    additionalProperties:
                        type: string
                    description: 'map,omitempty: optional; nil and empty are both omitted'
                audit:
                    type: object
                    properties:
                        by:
                            type: string
                    required:
                        - by
                    description: 'struct,omitempty: still required — a non-pointer struct is never empty, so omitempty has no effect'
                audit_zero:
                    type: object
                    properties:
                        by:
                            type: string
                    required:
                        - by
                    description: 'struct,omitzero: optional — omitzero omits the zero struct'
                created_at:
                    type: string
                    format: date-time
                    description: 'time.Time,omitempty: still required — time.Time is a struct, so omitempty has no effect'
                updated_at:
                    type: string
                    format: date-time
                    description: 'time.Time,omitzero: optional — omitzero omits the zero time'
            required:
                - plain
                - ptr
                - tags
                - audit
                - created_at
        UpdateUserPatch:
            type: object
            properties:
                email:
                    type:
                        - string
                        - "null"
                    format: email
                    description: Replace email; omit to leave unchanged, null to clear
                display_name:
                    type:
                        - string
                        - "null"
                    description: Replace display name; omit to leave unchanged, null to clear
