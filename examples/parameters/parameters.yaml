openapi: 3.1.0
info:
    title: Parameters Example
    description: 'Demonstrates all parameter types: path, query, header, and cookie.'
    version: 1.0.0
paths:
    /orgs/{orgId}/projects/{projectId}/resources/{resourceId}:
        get:
            summary: Get a nested resource
            description: Retrieves a resource using multiple path parameters.
            operationId: getNestedResource
            parameters:
                - name: orgId
                  in: path
                  description: Organization ID
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: projectId
                  in: path
                  description: Project ID
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: resourceId
                  in: path
                  description: Resource ID as integer
                  required: true
                  schema:
                    type: integer
                    format: int64
            responses:
                "200":
                    description: Resource found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Resource'
    /preferences:
        get:
            summary: Get user preferences
            description: Retrieves preferences from cookies.
            operationId: getPreferences
            parameters:
                - name: theme
                  in: cookie
                  description: User's preferred theme
                  required: false
                  schema:
                    type: string
                    enum:
                        - light
                        - dark
                        - system
                - name: lang
                  in: cookie
                  description: User's preferred language
                  required: false
                  schema:
                    type: string
                    pattern: ^[a-z]{2}(-[A-Z]{2})?$
            responses:
                "200":
                    description: Preferences retrieved
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Resource'
    /resources:
        get:
            summary: Search resources
            description: Search and filter resources with various query parameters.
            operationId: searchResources
            parameters:
                - name: q
                  in: query
                  description: Search query string
                  required: true
                  schema:
                    type: string
                    maxLength: 100
                    minLength: 1
                - name: limit
                  in: query
                  description: Maximum results
                  required: false
                  schema:
                    type: integer
                    maximum: 100
                    minimum: 1
                    default: 20
                - name: offset
                  in: query
                  description: Page offset
                  required: false
                  schema:
                    type: integer
                    minimum: 0
                    default: 0
                - name: sort
                  in: query
                  description: Sort order
                  required: false
                  schema:
                    type: string
                    enum:
                        - asc
                        - desc
                    default: asc
                - name: tags
                  in: query
                  description: Filter by tags (can specify multiple)
                  required: false
                  schema:
                    type: array
                    items:
                        type: string
                - name: include_deleted
                  in: query
                  description: Include deleted items
                  required: false
                  schema:
                    type: boolean
                - name: status
                  in: query
                  description: Filter by status
                  required: false
                  schema:
                    type: string
                    enum:
                        - active
                        - inactive
                        - pending
                - name: type
                  in: query
                  description: Filter by type
                  required: false
                  schema:
                    type: string
                    enum:
                        - a
                        - b
                        - c
                - name: created_after
                  in: query
                  description: Filter by creation date (ISO 8601)
                  required: false
                  schema:
                    type: string
                    format: date
                - name: ids
                  in: query
                  description: Filter by IDs (can specify multiple)
                  required: false
                  schema:
                    type: array
                    items:
                        type: string
                    format: uuid
            responses:
                "200":
                    description: Search results
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Resource'
        post:
            summary: Create a resource
            description: Creates a resource with idempotency and session tracking.
            operationId: createResource
            parameters:
                - name: X-Idempotency-Key
                  in: header
                  description: Idempotency key for safe retries
                  required: false
                  schema:
                    type: string
                    format: uuid
                - name: session_id
                  in: cookie
                  description: Session identifier
                  required: false
                  schema:
                    type: string
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Resource'
                required: true
            responses:
                "201":
                    description: Resource created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Resource'
    /resources/{id}:
        get:
            summary: Get a resource by ID
            description: Retrieves a single resource using path and header parameters.
            operationId: getResource
            parameters:
                - name: id
                  in: path
                  description: Resource ID
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: X-Request-ID
                  in: header
                  description: Unique request ID for tracing
                  required: false
                  schema:
                    type: string
                    format: uuid
                - name: X-API-Version
                  in: header
                  description: API version to use
                  required: false
                  schema:
                    type: string
                    default: v1
                - name: X-Correlation-ID
                  in: header
                  description: Correlation ID for distributed tracing
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Resource found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Resource'
components:
    schemas:
        Resource:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                    description: Resource ID
                name:
                    type: string
                    description: Resource name
                type:
                    type: string
                    description: Resource type
            required:
                - id
                - name
                - type
