openapi: 3.1.0
info:
    title: Custom Types Example
    description: Demonstrates field type resolution for custom types within schemas.
    version: 1.0.0
paths:
    /primitives:
        get:
            summary: Get primitive type resolution
            operationId: getPrimitives
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Primitives'
    /user:
        get:
            summary: Get a user
            operationId: getUser
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
components:
    schemas:
        Address:
            type: object
            properties:
                street:
                    type: string
                city:
                    type: string
                country:
                    type: string
            required:
                - street
                - city
                - country
        Primitives:
            type: object
            properties:
                int32:
                    type: integer
                    format: int32
                    description: Signed 32-bit
                int64:
                    type: integer
                    format: int64
                    description: Signed 64-bit
                uint32:
                    type: integer
                    description: Unsigned 32-bit
                uint64:
                    type: integer
                    description: Unsigned 64-bit
                float32:
                    type: number
                    format: float
                    description: Single precision
                float64:
                    type: number
                    format: double
                    description: Double precision
                bool:
                    type: boolean
                    description: Flag
                when:
                    type: string
                    format: date-time
                    description: Timestamp
                blob:
                    type: array
                    items:
                        type: string
                    format: byte
                    description: Raw bytes
                int64s:
                    type: array
                    items:
                        type: integer
                    description: Counts
                float32s:
                    type: array
                    items:
                        type: number
                    description: Ratios
                times:
                    type: array
                    items:
                        type: string
                    description: Timestamps
                counts_by_key:
                    type: object
                    additionalProperties:
                        type: integer
                    description: Counts by key
                flags_by_key:
                    type: object
                    additionalProperties:
                        type: boolean
                    description: Flags by key
                times_by_key:
                    type: object
                    additionalProperties:
                        type: string
                    description: Timestamps by key
            required:
                - int32
                - int64
                - uint32
                - uint64
                - float32
                - float64
                - bool
                - when
                - blob
                - int64s
                - float32s
                - times
                - counts_by_key
                - flags_by_key
                - times_by_key
        User:
            type: object
            properties:
                id:
                    type: string
                    description: User ID
                status:
                    type: integer
                    description: Status code
                balance:
                    type: number
                    format: double
                    description: Account balance
                labels:
                    type: array
                    items:
                        type: string
                    description: User tags
                work_address:
                    $ref: '#/components/schemas/Address'
                all_addresses:
                    type: array
                    items:
                        $ref: '#/components/schemas/Address'
                    description: All addresses
                address_book:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/Address'
                    description: Address book
                inline_address:
                    type: object
                    properties:
                        street:
                            type: string
                        city:
                            type: string
                    required:
                        - street
                        - city
                    description: Inline address
                location:
                    type: object
                    properties:
                        name:
                            type: string
                        address:
                            type: object
                            properties:
                                street:
                                    type: string
                                city:
                                    type: string
                                country:
                                    type: string
                            required:
                                - street
                                - city
                                - country
                        coordinates:
                            type: object
                            properties:
                                lat:
                                    type: number
                                    format: double
                                lng:
                                    type: number
                                    format: double
                            required:
                                - lat
                                - lng
                    required:
                        - name
                        - address
                        - coordinates
                    description: Nested location
            required:
                - id
                - status
                - balance
                - labels
                - work_address
                - all_addresses
                - address_book
                - inline_address
                - location
