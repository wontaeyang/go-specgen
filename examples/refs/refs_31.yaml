openapi: 3.1.0
info:
    title: Schema References Example
    description: |-
        Demonstrates how a field that references another schema is
        emitted, and how that emission differs between OpenAPI versions. A plain
        reference is a bare $ref; annotating or nullifying it requires a wrapper in
        3.0, where $ref may not carry sibling keywords, but not in 3.1+.
    version: 1.0.0
paths:
    /items/{id}:
        get:
            summary: Get an item
            operationId: getItem
            parameters:
                - name: id
                  in: path
                  description: Item ID
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                "200":
                    description: The item
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Item'
components:
    schemas:
        Item:
            type: object
            properties:
                plain:
                    $ref: '#/components/schemas/Owner'
                documented:
                    $ref: '#/components/schemas/Owner'
                    description: Documented owner reference
                nullable_ref:
                    oneOf:
                        - $ref: '#/components/schemas/Owner'
                        - type: "null"
                note:
                    type:
                        - string
                        - "null"
                    description: Optional note
                owners:
                    type: array
                    items:
                        $ref: '#/components/schemas/Owner'
                    description: Every owner involved
                owners_by_role:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/Owner'
                    description: Owners keyed by role
            required:
                - plain
                - documented
                - nullable_ref
                - note
                - owners
                - owners_by_role
            description: A resource with references to other schemas
        Owner:
            type: object
            properties:
                name:
                    type: string
                    description: Owner name
            required:
                - name
            description: Resource owner
